# -*- mode: python ; coding: utf-8 -*-
# pytest 配置。
#
# 为什么把默认的 python_files 关掉：tests/ 下是脚本式测试，pytest 默认的
# Python 收集器会在 import 阶段就执行整个文件（e2e 会开窗口）。改成由
# tests/conftest.py 的 pytest_collect_file 接管，每个脚本 = 一个用例、
# 在子进程里跑（详见那里的说明）。
[pytest]
testpaths = tests
python_files = _none_by_design_.py
addopts = -m "not gui" -q
markers =
    script: 脚本式测试（子进程执行，结果按用例报告）
    gui: 会开窗口 / 需要真人看屏幕 / 需要摄像头在线
    slow: 跑得久的用例
